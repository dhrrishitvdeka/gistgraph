[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gistgraph"
version = "0.1.0"
description = "Compress long contexts into a sparse latent graph that a frozen LLM reads as a soft prompt."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhrrishit V Deka" }]
keywords = ["context compression", "soft prompts", "graph neural networks", "long context", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pyyaml>=6.0",
    "torch>=2.6",
    "transformers>=4.45",
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/dhrrishitvdeka/gistgraph"
Repository = "https://github.com/dhrrishitvdeka/gistgraph"
Issues = "https://github.com/dhrrishitvdeka/gistgraph/issues"
Changelog = "https://github.com/dhrrishitvdeka/gistgraph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
baselines = ["llmlingua>=0.2.2"]
dev = [
    "pytest>=8.0",
    "ruff==0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gistgraph"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
    "gpu: tests that need a CUDA device (skipped when none is available)",
]
